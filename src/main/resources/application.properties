spring.application.name=tusViajes

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=admin
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

flights.api.base-url=${FLIGHTS_API_BASE_URL:http://localhost:8081}

# El tráfico de gestión usa un puerto separado, interno en el Compose global.
management.server.port=9091
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Logs JSON con el nombre del servicio y el contexto de cada solicitud.
logging.structured.format.console=ecs
spring.main.banner-mode=off

# Contexto W3C en HTTP; la exportación OTLP se activa sólo cuando se solicita.
management.tracing.propagation.type=w3c
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.tracing.export.otlp.enabled=${TRACING_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
# Los logs y las métricas conservan sus canales Loki y Prometheus.
management.logging.export.enabled=false
management.otlp.metrics.export.enabled=false
