version: '3.8'

services:
  db:
    image: postgres:15
    container_name: tusViajes_db
    environment:
      POSTGRES_DB: tusViajes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tvs-net

  app:
    build: .
    container_name: tusViajes_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/tusViajes
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - db
    networks:
      - tvs-net

volumes:
  pgdata:

networks:
  tvs-net:
    driver: bridge