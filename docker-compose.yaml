version: '3.8'

services:
  tus-viajes-app:
    build: .
    container_name: tusViajes_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-shared:5432/${DB_NAME:-postgres}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-admin}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-password}
      - FLIGHTS_API_BASE_URL=http://flights-api:8081
    networks:
      - local-dev-network

networks:
  local-dev-network:
    external: true